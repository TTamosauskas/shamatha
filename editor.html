<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Centro Pineal — Editor</title>
  <link rel="stylesheet" href="./assets/site.css?v=20260827-1450">
  <link rel="stylesheet" href="./assets/editor-v2.css?v=20260827-1450">
  <link rel="stylesheet" href="./assets/editor-cleanup.css?v=20260827-1450">
  <link rel="stylesheet" href="./assets/editor-dynamic-stages.css?v=20260827-1450">
  <link rel="stylesheet" href="./assets/editor-stage-structure.css?v=20260827-1450">
  <link rel="stylesheet" href="./assets/editor-child-stages.css?v=20260827-1450">
</head>
<body>
  <main class="shell">
    <header class="topbar">
      <div class="brand"><small>PAINEL DO EDITOR</small><strong>Centro Pineal</strong></div>
      <div class="toolbar">
        <a class="btn secondary small" href="./app.html">Visualizar caminho</a>
        <a class="btn secondary small" href="./lixeira/">Lixeira</a>
        <button class="btn secondary small" id="logout" type="button">Sair</button>
      </div>
    </header>

    <section class="grid">
      <div class="card">
        <div class="section-head">
          <div><h2>Liberação de acesso</h2></div>
        </div>
        <form id="inviteForm" class="invite-grid invite-grid-simple">
          <div class="field invite-email"><label for="inviteEmail">E-mail</label><input id="inviteEmail" type="email" placeholder="aluno@exemplo.com" required></div>
          <div class="field invite-submit"><label>&nbsp;</label><button class="btn primary small" type="submit">Adicionar</button></div>
        </form>
        <div id="accessStatus" class="status hidden"></div>
        <hr class="soft-rule">
        <form id="settingsForm">
          <div class="field"><label for="whatsappPhone">WhatsApp do professor</label><input id="whatsappPhone" inputmode="numeric" placeholder="5541999999999" /></div>
          <button class="btn secondary small" type="submit">Salvar WhatsApp</button>
        </form>
        <div id="settingsStatus" class="status hidden"></div>
      </div>

      <div class="card">
        <div class="section-head">
          <div><h2>Aula ao vivo</h2></div>
        </div>
        <form id="liveClassForm">
          <div class="field"><label for="liveClassUrl">Link exato da aula ao vivo</label><input id="liveClassUrl" type="url" value="https://us06web.zoom.us/j/84674720127" placeholder="https://us06web.zoom.us/j/..." required></div>
          <div class="live-schedule-grid">
            <div class="field"><label for="liveClassAt">Data e hora — Curitiba</label><input id="liveClassAt" type="datetime-local" required></div>
            <div class="field live-schedule-button"><label>&nbsp;</label><button class="btn primary small" type="submit">Agendar</button></div>
          </div>
        </form>
        <div id="liveClassStatus" class="status hidden"></div>
        <div id="liveClassList" class="live-class-list"></div>
      </div>
    </section>

    <section class="card" style="margin-top:20px">
      <div class="section-head">
        <div><h2>Usuários cadastrados</h2></div>
        <span class="badge" id="userCount">0 usuários</span>
      </div>
      <div class="user-list-tools">
        <input id="userSearch" type="search" inputmode="search" placeholder="Buscar usuário por e-mail" aria-label="Buscar usuário por e-mail">
      </div>
      <div class="table-wrap">
        <table>
          <thead><tr><th>E-mail</th><th>Última Sessão</th><th>Função</th><th>Estado</th><th>Ações</th></tr></thead>
          <tbody id="usersBody"></tbody>
        </table>
      </div>
      <div class="user-pagination" aria-label="Paginação de usuários">
        <button class="btn secondary small" id="userPagePrev" type="button" aria-label="Página anterior">Anterior</button>
        <span id="userPageLabel">0 usuários</span>
        <button class="btn secondary small" id="userPageNext" type="button" aria-label="Próxima página">Próxima</button>
      </div>
    </section>

    <section class="card" style="margin-top:20px">
      <div class="section-head">
        <div><h2 id="stageContentTitle">Conteúdo das etapas</h2></div>
      </div>
      <div id="stages"></div>
      <div class="stage-add-row">
        <button class="btn secondary" id="addStageButton" type="button">Adicionar Etapa</button>
        <span class="status hidden" id="addStageStatus"></span>
      </div>
      <div class="archived-stages hidden" id="archivedStagesSection" style="display:none!important" aria-hidden="true">
        <h3>Etapas removidas</h3>
        <div class="archived-stage-list" id="archivedStagesList"></div>
      </div>
    </section>
  </main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="./assets/config.js?v=20260827-1450"></script>
<script src="./assets/supabase-backend.js?v=20260827-1450"></script>
<script src="./assets/shamatha-extensions.js?v=20260827-1450"></script>
<script src="./assets/stage-identity.js?v=20260827-1450"></script>
<script src="./assets/child-stages-backend.js?v=20260827-1450"></script>
<script src="./assets/runtime-v3.js?v=20260827-1450"></script>
<script src="./assets/editor-v2.js?v=20260827-1450"></script>
<script src="./assets/editor-cleanup.js?v=20260827-1450"></script>
<script src="./assets/editor-enhancements.js?v=20260827-1450"></script>
<script src="./assets/editor-users-pagination.js?v=20260827-1450"></script>
<script src="./assets/editor-dynamic-stages.js?v=20260827-1450"></script>
<script src="./assets/editor-stage-structure.js?v=20260827-1450"></script>
<script src="./assets/editor-child-stages.js?v=20260827-1450"></script>
</body>
</html>
