<body>
  <main class="shell">
    <header class="topbar">
      <div class="brand"><small>PAINEL DO EDITOR</small><strong>Lixeira</strong></div>
      <div class="toolbar">
        <a class="btn secondary small" href="../editor.html">Voltar ao editor</a>
        <button class="btn secondary small" id="logout" type="button">Sair</button>
      </div>
    </header>

    <section class="card trash-card">
      <div class="section-head">
        <div><h2>Etapas removidas</h2></div>
        <span class="badge" id="trashCount">0 etapas</span>
      </div>
      <div id="trashStatus" class="status hidden" role="status" aria-live="polite"></div>
      <div id="trashEmpty" class="trash-empty hidden">Nenhuma etapa removida.</div>
      <div id="trashList" class="trash-list"></div>
    </section>
  </main>
