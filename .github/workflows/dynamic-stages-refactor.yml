name: Dynamic stages refactor

on:
  push:
    branches:
      - dynamic-stages

permissions:
  contents: write

jobs:
  refactor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dynamic-stages
      - name: Apply refactor
        run: python3 tools/refactor_dynamic_stages.py
      - name: Validate JavaScript
        run: |
          node --check assets/supabase-backend.js
          node --check assets/app.js
          node --check assets/journey-replay.js
          node --check assets/editor-dynamic-stages.js
          grep -q "Adicionar Etapa" editor.html
          grep -q "dynamic-journey.css" app.html
          grep -q "add_shamatha_stage" assets/supabase-backend.js
      - name: Commit generated refactor
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Torna quantidade de etapas e trilha dinâmicas"
          git push origin HEAD:dynamic-stages
