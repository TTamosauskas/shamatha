name: Dynamic stages refactor

on:
  push:
    branches: [dynamic-stages]

permissions:
  contents: write

jobs:
  refactor:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dynamic-stages
      - name: Refactor dynamic stages
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          VERSION = '20260825-1420'

          def replace_once(text, old, new, label):
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected 1 occurrence, found {count}')
              return text.replace(old, new, 1)

          def regex_once(text, pattern, replacement, label):
              updated, count = re.subn(pattern, replacement, text, count=1, flags=re.S)
              if count != 1:
                  raise SystemExit(f'{label}: expected 1 regex match, found {count}')
              return updated

          # ---------- browser backend ----------
          backend_path = Path('assets/supabase-backend.js')
          backend = backend_path.read_text()
          old_progress = '''  function defaultProgress() {
            const stages = {};
            for (let i = 1; i <= 9; i += 1) stages[i] = defaultStageProgress();
            return { currentStage: 1, stages, updatedAt: Date.now() };
          }

          function normalizeProgress(input) {
            const progress = input && typeof input === 'object' ? structuredClone(input) : defaultProgress();
            progress.currentStage = Math.max(1, Math.min(9, Number(progress.currentStage || 1)));
            progress.stages = progress.stages && typeof progress.stages === 'object' ? progress.stages : {};
            for (let i = 1; i <= 9; i += 1) {
              const existing = progress.stages[i] || progress.stages[String(i)] || {};
              progress.stages[i] = { ...defaultStageProgress(), ...existing };
              progress.stages[i].sessions = Array.isArray(progress.stages[i].sessions) ? progress.stages[i].sessions.slice(-500) : [];
            }
            progress.updatedAt = Date.now();
            return progress;
          }
'''
          new_progress = '''  function defaultProgress(totalStages = 9) {
            const count = clampInt(totalStages, 1, 30, 9);
            const stages = {};
            for (let i = 1; i <= count; i += 1) stages[i] = defaultStageProgress();
            return { currentStage: 1, stages, updatedAt: Date.now() };
          }

          function normalizeProgress(input, totalStages = null) {
            const hasInput = input && typeof input === 'object';
            const progress = hasInput ? structuredClone(input) : { currentStage:1, stages:{}, updatedAt:Date.now() };
            progress.stages = progress.stages && typeof progress.stages === 'object' ? progress.stages : {};
            const existingNumbers = Object.keys(progress.stages)
              .map(value => Number(value))
              .filter(value => Number.isInteger(value) && value >= 1 && value <= 30);
            const previousTotal = existingNumbers.length ? Math.max(...existingNumbers) : 1;
            const inferred = Math.max(previousTotal, Number(progress.currentStage || 1));
            const count = clampInt(totalStages == null ? inferred : totalStages, 1, 30, 9);

            for (let i = 1; i <= count; i += 1) {
              const existing = progress.stages[i] || progress.stages[String(i)] || {};
              progress.stages[i] = { ...defaultStageProgress(), ...existing };
              progress.stages[i].sessions = Array.isArray(progress.stages[i].sessions) ? progress.stages[i].sessions.slice(-500) : [];
            }

            let current = Math.max(1, Math.min(count, Number(progress.currentStage || 1)));
            if (
              hasInput && count > previousTotal && current === previousTotal &&
              Boolean(progress.stages[previousTotal]?.completedAt)
            ) {
              current = Math.min(count, previousTotal + 1);
            }
            progress.currentStage = current;
            progress.updatedAt = Date.now();
            return progress;
          }
'''
          backend = replace_once(backend, old_progress, new_progress, 'backend progress')
          backend = replace_once(
              backend,
              "    let progress = defaultProgress();\n    if (profile.role !== 'editor') {",
              "    const totalStages = clampInt((stagesResult.data || []).length, 1, 30, 1);\n    let progress = defaultProgress(totalStages);\n    if (profile.role !== 'editor') {",
              'backend app total'
          )
          backend = replace_once(
              backend,
              "      progress = normalizeProgress(result.data?.data);",
              "      progress = normalizeProgress(result.data?.data, totalStages);",
              'backend app normalize'
          )
          backend = replace_once(
              backend,
              "    if (number < 1 || number > 9) throw new BackendError('Etapa inválida.', 400);",
              "    if (number < 1 || number > 30) throw new BackendError('Etapa inválida.', 400);",
              'backend stage max'
          )
          backend = replace_once(
              backend,
              "  async function saveSettings(body) {",
              '''  async function addStage() {
            const sb = getClient();
            await requireProfile({ editor: true });
            const result = await sb.rpc('add_shamatha_stage');
            if (result.error) throw new BackendError(readableError(result.error), 400, result.error);
            const row = Array.isArray(result.data) ? result.data[0] : result.data;
            if (!row) throw new BackendError('A nova etapa não pôde ser criada.', 400);
            return { stage: stageFromRow(row) };
          }

          async function saveSettings(body) {''',
              'backend add stage function'
          )
          backend = replace_once(
              backend,
              "    if (path === '/api/editor/settings' && method === 'PUT') return saveSettings(body);\n\n    const stageMatch",
              "    if (path === '/api/editor/settings' && method === 'PUT') return saveSettings(body);\n    if (path === '/api/editor/stages' && method === 'POST') return addStage();\n\n    const stageMatch",
              'backend add stage route'
          )
          backend_path.write_text(backend)

          # ---------- dynamic app ----------
          app_path = Path('assets/app.js')
          app = app_path.read_text()
          app = replace_once(
              app,
              "    elephant: document.getElementById('journeyElephant'),\n    stages: [...document.querySelectorAll('.stage')],",
              "    elephant: document.getElementById('journeyElephant'),\n    journey: document.querySelector('.journey'),\n    journeySvg: document.querySelector('.journey-svg'),\n    stages: [],",
              'app element refs'
          )
          app = regex_once(
              app,
              r"  const stagePositions = \{\n.*?\n  \};",
              "  const BASE_JOURNEY_PATH = 'M260 1225 C620 1165 760 1085 640 975 C520 865 235 880 250 745 C265 610 720 655 730 505 C740 355 430 350 540 210 C600 135 690 110 760 95';\n  const stagePositions = { 1:{left:26,top:87.5} };\n  function totalStages() { return Math.max(1, Math.min(30, Number(appData?.stages?.length || 1))); }\n  function lastStage() { return totalStages(); }",
              'app stage constants'
          )
          app = replace_once(app, "progress.currentStage < 9", "progress.currentStage < lastStage()", 'app complete max')
          app = replace_once(app, "stage <= 9", "stage <= lastStage()", 'app regression max')

          new_layout = r'''  function journeyViewBox() {
            const box = el.journeySvg?.viewBox?.baseVal;
            return {
              width: Number(box?.width || 1000),
              height: Number(box?.height || 1400)
            };
          }

          function catmullRomPath(points) {
            if (points.length < 2) return '';
            let d = `M${points[0].x} ${points[0].y}`;
            for (let i = 0; i < points.length - 1; i += 1) {
              const p0 = points[Math.max(0, i - 1)];
              const p1 = points[i];
              const p2 = points[i + 1];
              const p3 = points[Math.min(points.length - 1, i + 2)];
              const c1x = p1.x + (p2.x - p0.x) / 6;
              const c1y = p1.y + (p2.y - p0.y) / 6;
              const c2x = p2.x - (p3.x - p1.x) / 6;
              const c2y = p2.y - (p3.y - p1.y) / 6;
              d += ` C${c1x.toFixed(1)} ${c1y.toFixed(1)} ${c2x.toFixed(1)} ${c2y.toFixed(1)} ${p2.x} ${p2.y}`;
            }
            return d;
          }

          function journeyGeometry() {
            const total = totalStages();
            if (total <= 9) return { path:BASE_JOURNEY_PATH, viewHeight:1400, extraCurves:0 };
            const extraCurves = Math.ceil((total - 9) / 4);
            const turns = 4 + extraCurves;
            const viewHeight = 1400 + extraCurves * 420;
            const bottom = viewHeight - 175;
            const top = 95;
            const usable = bottom - top;
            const points = [{ x:260, y:bottom }];
            for (let i = 1; i <= turns; i += 1) {
              points.push({
                x: i % 2 ? 735 : 250,
                y: Math.round(bottom - usable * (i / (turns + 1)))
              });
            }
            points.push({ x:760, y:top });
            return { path:catmullRomPath(points), viewHeight, extraCurves };
          }

          function renderStageMarkers() {
            if (!el.journey) return;
            el.journey.querySelectorAll('.stage').forEach(button => button.remove());
            const fragment = document.createDocumentFragment();
            for (let stage = 1; stage <= totalStages(); stage += 1) {
              const button = document.createElement('button');
              button.className = 'stage future';
              button.type = 'button';
              button.dataset.stage = String(stage);
              button.setAttribute('aria-label', `Abrir etapa ${stage}`);
              button.innerHTML = `<span>${stage}</span>`;
              fragment.appendChild(button);
            }
            el.journey.insertBefore(fragment, el.elephant);
            el.stages = [...el.journey.querySelectorAll('.stage')];
          }

          function configureJourneyGeometry() {
            if (!el.journeySvg) return;
            const geometry = journeyGeometry();
            el.journeySvg.setAttribute('viewBox', `0 0 1000 ${geometry.viewHeight}`);
            document.querySelectorAll('.path-shadow,.path-line,.path-glow').forEach(path => path.setAttribute('d', geometry.path));
            const shell = document.getElementById('appShell');
            if (geometry.extraCurves > 0) {
              const height = Math.max(window.innerHeight, window.innerHeight + geometry.extraCurves * 320);
              shell?.classList.add('dynamic-journey');
              document.body.classList.add('dynamic-journey-scroll');
              shell?.style.setProperty('--journey-height', `${height}px`);
            } else {
              shell?.classList.remove('dynamic-journey');
              document.body.classList.remove('dynamic-journey-scroll');
              shell?.style.removeProperty('--journey-height');
              window.scrollTo(0, 0);
            }
            renderStageMarkers();
          }

          function rebuildUniformJourneyLayout() {
            const path = document.querySelector('.path-line');
            const svg = el.journeySvg;
            if (!path || !svg || typeof path.getTotalLength !== 'function') return;
            const rect = svg.getBoundingClientRect();
            if (!rect.width || !rect.height) return;
            const view = journeyViewBox();
            const pathLength = path.getTotalLength(), sampleCount = Math.max(900, totalStages() * 80), scaleX = rect.width/view.width, scaleY = rect.height/view.height;
            let visualDistance = 0, previous = null;
            const samples = [];
            for (let i=0;i<=sampleCount;i+=1) {
              const length = pathLength * (i/sampleCount), point = path.getPointAtLength(length);
              if (previous) visualDistance += Math.hypot((point.x-previous.x)*scaleX,(point.y-previous.y)*scaleY);
              samples.push({ length, x:point.x, y:point.y, visualDistance }); previous = point;
            }
            journeySamples = samples; journeyVisualLength = visualDistance;
            const total = totalStages(), denominator = Math.max(1, total - 1);
            for (let stage=1; stage<=total; stage+=1) {
              const pos = pointOnJourneyVisual((stage-1)/denominator); stagePositions[stage] = pos;
              const button = el.stages.find(item => Number(item.dataset.stage) === stage);
              if (button) { button.style.left=`${pos.left}%`; button.style.top=`${pos.top}%`; }
            }
          }

          function pointOnJourneyVisual'''
          app = regex_once(
              app,
              r"  function rebuildUniformJourneyLayout\(\) \{.*?\n  \}\n\n  function pointOnJourneyVisual",
              new_layout,
              'app dynamic layout'
          )
          app = replace_once(
              app,
              "      const a=stagePositions[1], b=stagePositions[9]; return { left:a.left+(b.left-a.left)*ratio, top:a.top+(b.top-a.top)*ratio };",
              "      const a=stagePositions[1] || {left:26,top:87.5}, b=stagePositions[lastStage()] || a; return { left:a.left+(b.left-a.left)*ratio, top:a.top+(b.top-a.top)*ratio };",
              'app fallback endpoint'
          )
          old_current = '''  function currentPosition() {
            const stage = progress.currentStage;
            if (stage >= 9 && stageState(9).completedAt) return { ...stagePositions[9], stage:9 };
            const cfg = config(stage), count = completedCount(stage), ratio = Math.max(0, Math.min(1, count/cfg.sessionsRequired));
            const pathRatio = ((stage-1)+ratio)/8;
            return { ...pointOnJourneyVisual(pathRatio), stage };
          }
'''
          new_current = '''  function currentPosition() {
            const stage = progress.currentStage, total = totalStages(), last = lastStage();
            if (total <= 1) return { ...(stagePositions[1] || {left:26,top:87.5}), stage:1 };
            if (stage >= last && stageState(last).completedAt) return { ...stagePositions[last], stage:last };
            const cfg = config(stage), count = completedCount(stage), ratio = Math.max(0, Math.min(1, count/cfg.sessionsRequired));
            const pathRatio = ((stage-1)+ratio)/Math.max(1,total-1);
            return { ...pointOnJourneyVisual(pathRatio), stage };
          }
'''
          app = replace_once(app, old_current, new_current, 'app current position')
          app = replace_once(
              app,
              "    const cfg = config(current), count = completedCount(current), allDone = current === 9 && Boolean(stageState(9).completedAt);",
              "    const last = lastStage(), total = totalStages();\n    const cfg = config(current), count = completedCount(current), allDone = current === last && Boolean(stageState(last).completedAt);",
              'app all done'
          )
          app = replace_once(app, "stagePositions[Math.min(9,current+1)]", "stagePositions[Math.min(last,current+1)]", 'app next position')
          app = replace_once(
              app,
              "    el.elephant.className = `elephant stage-${current}${animateAdvance ? ' walking journey-elephant-progress-glow' : ''}`;",
              "    el.elephant.className = `elephant stage-${current}${current >= 6 ? ' stage-late' : ''}${animateAdvance ? ' walking journey-elephant-progress-glow' : ''}`;",
              'app elephant late stage'
          )
          app = replace_once(
              app,
              "    el.homeStatus.textContent = allDone ? 'Caminho concluído' : `Etapa ${current} de 9`;",
              "    el.homeStatus.textContent = allDone ? 'Caminho concluído' : `Etapa ${current} de ${total}`;",
              'app home status'
          )
          app = replace_once(
              app,
              "    el.miniProgress.textContent = allDone ? '9 etapas concluídas' : `${count}/${cfg.sessionsRequired} · últimos ${cfg.deadlineDays} dias`;",
              "    el.miniProgress.textContent = allDone ? `${total} etapas concluídas` : `${count}/${cfg.sessionsRequired} · ${cfg.deadlineDays} dias`;",
              'app mini progress'
          )
          app = replace_once(
              app,
              "    el.continuePath.textContent = allDone ? 'Rever etapa 9' : 'Abrir etapa';",
              "    el.continuePath.textContent = allDone ? `Rever etapa ${last}` : 'Abrir etapa';\n    if (animateAdvance && document.getElementById('appShell')?.classList.contains('dynamic-journey')) {\n      const targetY = Math.max(0, (pos.top / 100) * document.getElementById('appShell').offsetHeight - window.innerHeight * .48);\n      window.scrollTo({ top:targetY, behavior:'smooth' });\n    }",
              'app final button'
          )
          old_stage_listener = '''  el.stages.forEach(btn=>btn.addEventListener('click',()=>{
            const stage=Number(btn.dataset.stage), current=progress.currentStage;
            if(stage>current){showToast(`A etapa ${stage} será liberada pelo avanço nas etapas anteriores.`);return;}
            selectedStage=stage;
            openUnit(stageState().introDone?'practice':'intro');
          }));'''
          new_stage_listener = '''  el.journey?.addEventListener('click',event=>{
            const btn=event.target.closest('.stage');
            if(!btn || !el.journey.contains(btn) || !progress)return;
            const stage=Number(btn.dataset.stage), current=progress.currentStage;
            if(stage>current){showToast(`A etapa ${stage} será liberada pelo avanço nas etapas anteriores.`);return;}
            selectedStage=stage;
            openUnit(stageState().introDone?'practice':'intro');
          });'''
          app = replace_once(app, old_stage_listener, new_stage_listener, 'app stage delegation')
          app = replace_once(
              app,
              "  window.addEventListener('resize',()=>{clearTimeout(journeyLayoutTimer);journeyLayoutTimer=setTimeout(()=>{rebuildUniformJourneyLayout();updateHome();},120);});",
              "  window.addEventListener('resize',()=>{clearTimeout(journeyLayoutTimer);journeyLayoutTimer=setTimeout(()=>{configureJourneyGeometry();rebuildUniformJourneyLayout();updateHome();},120);});",
              'app resize'
          )
          app = replace_once(
              app,
              "    selectedStage=progress.currentStage; rebuildUniformJourneyLayout(); updateHome(); recoveredSessionPending=recoverInterruptedSession();",
              "    selectedStage=progress.currentStage; configureJourneyGeometry(); rebuildUniformJourneyLayout(); updateHome(); recoveredSessionPending=recoverInterruptedSession();",
              'app init geometry'
          )

          suspicious = [r'currentStage\s*<\s*9', r'stage\s*<=\s*9', r'stagePositions\[9\]', r'/8\b', r'de 9`', r"Rever etapa 9", r"9 etapas concluídas"]
          for pattern in suspicious:
              if re.search(pattern, app):
                  raise SystemExit(f'app still contains fixed-stage pattern: {pattern}')
          app_path.write_text(app)

          # ---------- HTML ----------
          app_html_path = Path('app.html')
          html = app_html_path.read_text()
          html = html.replace('Etapa 1 de 9', 'Carregando etapas…')
          html = html.replace('aria-label="Caminho de nove etapas"', 'aria-label="Caminho das etapas de meditação"')
          html = re.sub(r'\n      <button class="stage[^\n]+</button>', '', html)
          html = html.replace('<link rel="stylesheet" href="./assets/objective-preview.css?v=20260825-0655" />', f'<link rel="stylesheet" href="./assets/objective-preview.css?v={VERSION}" />\n  <link rel="stylesheet" href="./assets/dynamic-journey.css?v={VERSION}" />')
          html = html.replace('20260825-0655', VERSION).replace('20260825-0910', VERSION)
          app_html_path.write_text(html)

          editor_html_path = Path('editor.html')
          editor_html = editor_html_path.read_text()
          editor_html = editor_html.replace('<div><h2>Conteúdo das 9 etapas</h2></div>', '<div><h2 id="stageContentTitle">Conteúdo das etapas</h2></div>')
          editor_html = editor_html.replace('<div id="stages"></div>\n    </section>', '<div id="stages"></div>\n      <div class="stage-add-row">\n        <button class="btn secondary" id="addStageButton" type="button">Adicionar Etapa</button>\n        <span class="status hidden" id="addStageStatus"></span>\n      </div>\n    </section>')
          editor_html = editor_html.replace('<link rel="stylesheet" href="./assets/editor-cleanup.css?v=20260825-0920">', f'<link rel="stylesheet" href="./assets/editor-cleanup.css?v={VERSION}">\n  <link rel="stylesheet" href="./assets/editor-dynamic-stages.css?v={VERSION}">')
          editor_html = editor_html.replace('20260824-1257', VERSION).replace('20260825-0920', VERSION)
          editor_html = editor_html.replace('</body>', f'<script src="./assets/editor-dynamic-stages.js?v={VERSION}"></script>\n</body>')
          editor_html_path.write_text(editor_html)

          # ---------- new supporting assets ----------
          Path('assets/dynamic-journey.css').write_text(r'''body.dynamic-journey-scroll {
            overflow-x: hidden;
            overflow-y: auto;
            min-height: 100%;
          }
          .app-shell.dynamic-journey {
            height: var(--journey-height, 100dvh);
            min-height: 100dvh;
            overflow: visible;
          }
          .app-shell.dynamic-journey .home-header,
          .app-shell.dynamic-journey .current-card,
          .app-shell.dynamic-journey .toast {
            position: fixed;
          }
          .app-shell.dynamic-journey .sky-haze,
          .app-shell.dynamic-journey .mountains {
            position: fixed;
          }
          .elephant.stage-late {
            filter: grayscale(.25) brightness(1.16) drop-shadow(0 8px 10px rgba(0,0,0,.2));
          }
          @media (max-width: 760px) {
            .app-shell.dynamic-journey .stage {
              width: 44px;
              height: 44px;
              margin: -22px 0 0 -22px;
            }
            .app-shell.dynamic-journey .stage.current {
              width: 56px;
              height: 56px;
              margin: -28px 0 0 -28px;
            }
          }
          ''')

          Path('assets/editor-dynamic-stages.css').write_text('''.stage-add-row {
            display:flex;
            align-items:center;
            justify-content:flex-end;
            gap:12px;
            margin-top:16px;
            padding-top:16px;
            border-top:1px solid rgba(15,23,42,.08);
          }
          .stage-add-row .status { margin:0; }
          @media (max-width:760px) {
            .stage-add-row { align-items:stretch; flex-direction:column; }
            .stage-add-row .btn { width:100%; }
          }
          ''')

          Path('assets/editor-dynamic-stages.js').write_text(r'''(() => {
            'use strict';
            const root = document.getElementById('stages');
            const title = document.getElementById('stageContentTitle');
            const button = document.getElementById('addStageButton');
            const status = document.getElementById('addStageStatus');
            if (!root || !title || !button || !status) return;

            function stageCount() {
              return root.querySelectorAll('[data-stage-details]').length;
            }

            function sync() {
              const count = stageCount();
              title.textContent = `Conteúdo das ${count} ${count === 1 ? 'etapa' : 'etapas'}`;
              button.disabled = count >= 30;
              button.title = count >= 30 ? 'Limite de 30 etapas atingido' : 'Adicionar uma nova etapa ao final do caminho';
            }

            function setStatus(message, kind = 'good') {
              status.textContent = message;
              status.className = `status ${kind}`;
            }

            button.addEventListener('click', async () => {
              if (stageCount() >= 30) return setStatus('O caminho atingiu o limite de 30 etapas.', 'bad');
              button.disabled = true;
              setStatus('Adicionando etapa…');
              try {
                const data = await window.ShamathaBackend.request('/api/editor/stages', { method:'POST', body:'{}' });
                if (!data?.stage) throw new Error('A nova etapa não foi retornada pelo serviço.');
                if (typeof editorData !== 'undefined' && typeof renderStages === 'function') {
                  editorData.stages = [...(editorData.stages || []), data.stage].sort((a,b) => a.number - b.number);
                  renderStages(data.stage.number);
                  sync();
                  setStatus(`Etapa ${data.stage.number} adicionada. Edite os campos e salve.`);
                } else {
                  location.reload();
                }
              } catch (error) {
                setStatus(error?.message || 'Falha ao adicionar a etapa.', 'bad');
                sync();
              }
            });

            new MutationObserver(sync).observe(root, { childList:true, subtree:false });
            sync();
          })();
          ''')

          # ---------- replay follows generated path ----------
          replay = r'''(() => {
            'use strict';

            const elephant = document.getElementById('journeyElephant');
            const path = document.querySelector('.path-line');
            const svg = document.querySelector('.journey-svg');
            const shell = document.getElementById('appShell');
            if (!elephant || !path || !svg || typeof path.getTotalLength !== 'function') return;

            let replayDone = false;
            let replayStarted = false;
            let observer = null;

            function viewBox() {
              const box = svg.viewBox?.baseVal;
              return { width:Number(box?.width || 1000), height:Number(box?.height || 1400) };
            }

            function follow(top, behavior = 'auto') {
              if (!shell?.classList.contains('dynamic-journey')) return;
              const y = Math.max(0, (top / 100) * shell.offsetHeight - window.innerHeight * .48);
              window.scrollTo({ top:y, behavior });
            }

            function setStartPosition() {
              const view = viewBox();
              const point = path.getPointAtLength(0);
              const left = (point.x / view.width) * 100;
              const top = (point.y / view.height) * 100;
              elephant.style.transition = 'none';
              elephant.style.left = `${left}%`;
              elephant.style.top = `${top}%`;
              follow(top);
            }

            function buildSamples() {
              const rect = svg.getBoundingClientRect();
              const view = viewBox();
              const pathLength = path.getTotalLength();
              const scaleX = Math.max(1, rect.width) / view.width;
              const scaleY = Math.max(1, rect.height) / view.height;
              const sampleCount = 1400;
              const samples = [];
              let distance = 0;
              let previous = null;

              for (let i = 0; i <= sampleCount; i += 1) {
                const length = pathLength * (i / sampleCount);
                const point = path.getPointAtLength(length);
                if (previous) distance += Math.hypot((point.x - previous.x) * scaleX, (point.y - previous.y) * scaleY);
                samples.push({ x:point.x, y:point.y, left:(point.x/view.width)*100, top:(point.y/view.height)*100, distance });
                previous = point;
              }
              return samples;
            }

            function nearestTargetIndex(samples, targetLeft, targetTop) {
              let bestIndex = 0, bestDistance = Infinity;
              for (let i = 0; i < samples.length; i += 1) {
                const dx = samples[i].left - targetLeft, dy = samples[i].top - targetTop;
                const distance = dx * dx + dy * dy;
                if (distance < bestDistance) { bestDistance = distance; bestIndex = i; }
              }
              return bestIndex;
            }

            function sampleAtDistance(samples, maxIndex, targetDistance) {
              let low = 0, high = maxIndex;
              while (low < high) {
                const mid = Math.floor((low + high) / 2);
                if (samples[mid].distance < targetDistance) low = mid + 1;
                else high = mid;
              }
              return samples[low];
            }

            function easeInOutCubic(t) {
              return t < .5 ? 4*t*t*t : 1 - Math.pow(-2*t+2,3)/2;
            }

            function finishAt(targetLeft, targetTop) {
              elephant.style.left = `${targetLeft}%`;
              elephant.style.top = `${targetTop}%`;
              elephant.classList.remove('walking','journey-elephant-replay');
              elephant.style.transition = '';
              follow(targetTop, 'smooth');
              replayDone = true;
            }

            function replayTo(targetLeft, targetTop) {
              if (replayDone || replayStarted) return;
              replayStarted = true;
              observer?.disconnect();
              const samples = buildSamples();
              const targetIndex = nearestTargetIndex(samples,targetLeft,targetTop);
              const targetDistance = samples[targetIndex]?.distance || 0;
              setStartPosition();
              elephant.classList.add('walking','journey-elephant-replay');
              void elephant.offsetWidth;

              if (targetIndex <= 2 || targetDistance <= 1 || window.matchMedia?.('(prefers-reduced-motion: reduce)').matches) {
                finishAt(targetLeft,targetTop);
                return;
              }

              const fullDistance = samples[samples.length-1].distance || targetDistance;
              const ratio = Math.max(0,Math.min(1,targetDistance/fullDistance));
              const duration = 1300 + 3200 * ratio;
              const startTime = performance.now();
              let previousX = samples[0].x;

              const frame = now => {
                const elapsed = Math.min(1,(now-startTime)/duration);
                const point = sampleAtDistance(samples,targetIndex,targetDistance*easeInOutCubic(elapsed));
                elephant.style.left = `${point.left}%`;
                elephant.style.top = `${point.top}%`;
                follow(point.top);
                if (Math.abs(point.x-previousX) > .25) elephant.style.setProperty('--face',point.x>previousX?'-1':'1');
                previousX = point.x;
                if (elapsed < 1) return requestAnimationFrame(frame);
                finishAt(targetLeft,targetTop);
              };
              requestAnimationFrame(frame);
            }

            setStartPosition();
            observer = new MutationObserver(() => {
              if (replayDone || replayStarted) return;
              queueMicrotask(() => {
                const targetLeft = Number.parseFloat(elephant.style.left);
                const targetTop = Number.parseFloat(elephant.style.top);
                if (Number.isFinite(targetLeft) && Number.isFinite(targetTop)) replayTo(targetLeft,targetTop);
              });
            });
            observer.observe(elephant,{attributes:true,attributeFilter:['style','class']});
          })();
          '''
          Path('assets/journey-replay.js').write_text(replay)

          # ---------- PWA versions ----------
          manifest = Path('manifest.webmanifest').read_text().replace('20260825-0655', VERSION)
          Path('manifest.webmanifest').write_text(manifest)

          sw = Path('service-worker.js').read_text()
          sw = sw.replace("const CACHE = 'shamatha-shell-v11';", "const CACHE = 'shamatha-shell-v12';")
          sw = sw.replace('20260825-0655', VERSION)
          shell_anchor = f"  './assets/objective-preview.css?v={VERSION}',"
          sw = sw.replace(shell_anchor, shell_anchor + f"\n  './assets/dynamic-journey.css?v={VERSION}',")
          Path('service-worker.js').write_text(sw)

          # Remove this one-shot workflow from the resulting feature commit.
          Path('.github/workflows/dynamic-stages-refactor.yml').unlink(missing_ok=True)
          PY

      - name: Validate JavaScript
        run: |
          node --check assets/supabase-backend.js
