name: Hotfix stagesById reference

on:
  push:
    branches:
      - hotfix-stagesbyid-reference
    paths:
      - .github/workflows/hotfix-stagesbyid.yml

permissions:
  contents: write

jobs:
  hotfix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: hotfix-stagesbyid-reference
      - name: Apply hotfix
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path('assets/stage-identity.js')
          s = p.read_text()
          old = "      stagesById,\n"
          new = "      stagesById: statesById,\n"
          if old not in s:
              raise SystemExit('broken stagesById shorthand not found')
          p.write_text(s.replace(old, new, 1))

          for name in ['app.html', 'editor.html', 'manifest.webmanifest', 'service-worker.js']:
              p = Path(name)
              s = p.read_text().replace('20260826-0945', '20260826-0955')
              if name == 'service-worker.js':
                  s = s.replace('shamatha-shell-v14', 'shamatha-shell-v15')
              p.write_text(s)
          PY
      - name: Validate hotfix
        run: |
          node --check assets/stage-identity.js
          grep -q 'stagesById: statesById' assets/stage-identity.js
          ! grep -q '^      stagesById,$' assets/stage-identity.js
          grep -q '20260826-0955' app.html
          grep -q 'shamatha-shell-v15' service-worker.js
      - name: Commit hotfix
        run: |
          git config user.name Tamosauskas
          git config user.email thiago.gt@gmail.com
          git add assets/stage-identity.js app.html editor.html manifest.webmanifest service-worker.js
          git commit -m 'Corrige referência stagesById no progresso'
          git push origin HEAD:hotfix-stagesbyid-reference
