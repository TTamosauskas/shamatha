name: Fix dynamic viewbox

on:
  push:
    branches:
      - dynamic-stages

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dynamic-stages
      - name: Fix viewbox coordinate conversion
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('assets/app.js')
          s=p.read_text()
          old="    return { left:(x/1000)*100, top:(y/1400)*100 };"
          new="    const view=journeyViewBox();\n    return { left:(x/view.width)*100, top:(y/view.height)*100 };"
          if s.count(old)!=1:
              raise SystemExit(f'expected one coordinate conversion, got {s.count(old)}')
          p.write_text(s.replace(old,new,1))
          Path('.github/workflows/fix-dynamic-viewbox.yml').unlink()
          PY
          node --check assets/app.js
          grep -q "x/view.width" assets/app.js
          grep -q "y/view.height" assets/app.js
      - name: Commit fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Corrige coordenadas da trilha dinâmica"
          git push origin HEAD:dynamic-stages
