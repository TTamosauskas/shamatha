name: Child stages build
on:
  push:
    branches: [child-stages]
    paths: [.github/workflows/child-stages-build.yml]
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: child-stages
      - name: Patch integration
        run: |
          python3 - <<'PY'
          from pathlib import Path
          V='20260827-1450'

          p=Path('assets/stage-identity.js')
          s=p.read_text()
          old=".select('number,stage_id,position,is_active')\n      .order('position'"
          new=".select('number,stage_id,position,is_active,parent_stage_id')\n      .is('parent_stage_id', null)\n      .order('position'"
          if old not in s: raise SystemExit('identityRows pattern missing')
          p.write_text(s.replace(old,new,1))

          p=Path('app.html'); s=p.read_text()
          s=s.replace('<link rel="stylesheet" href="./assets/dynamic-journey.css?v=20260826-0955" />','<link rel="stylesheet" href="./assets/dynamic-journey.css?v='+V+'" />\n  <link rel="stylesheet" href="./assets/child-stages.css?v='+V+'" />')
          s=s.replace('<script src="./assets/stage-identity.js?v=20260826-0955"></script>','<script src="./assets/stage-identity.js?v='+V+'"></script>\n<script src="./assets/child-stages-backend.js?v='+V+'"></script>')
          s=s.replace('<script src="./assets/app.js?v=20260826-0955"></script>','<script src="./assets/app.js?v='+V+'"></script>\n<script src="./assets/child-stages.js?v='+V+'"></script>')
          s=s.replace('20260826-0955',V)
          p.write_text(s)

          p=Path('editor.html'); s=p.read_text()
          s=s.replace('<link rel="stylesheet" href="./assets/editor-stage-structure.css?v=20260826-0955">','<link rel="stylesheet" href="./assets/editor-stage-structure.css?v='+V+'">\n  <link rel="stylesheet" href="./assets/editor-child-stages.css?v='+V+'">')
          s=s.replace('<script src="./assets/stage-identity.js?v=20260826-0955"></script>','<script src="./assets/stage-identity.js?v='+V+'"></script>\n<script src="./assets/child-stages-backend.js?v='+V+'"></script>')
          s=s.replace('<script src="./assets/editor-stage-structure.js?v=20260826-0955"></script>','<script src="./assets/editor-stage-structure.js?v='+V+'"></script>\n<script src="./assets/editor-child-stages.js?v='+V+'"></script>')
          s=s.replace('20260826-0955',V)
          p.write_text(s)

          p=Path('lixeira/index.html'); s=p.read_text()
          s=s.replace('<script src="../assets/stage-identity.js?v=20260826-0955"></script>','<script src="../assets/stage-identity.js?v='+V+'"></script>\n<script src="../assets/child-stages-backend.js?v='+V+'"></script>')
          s=s.replace('20260826-0955',V).replace('20260826-1040',V)
          p.write_text(s)

          p=Path('manifest.webmanifest'); s=p.read_text().replace('20260826-0955',V); p.write_text(s)

          p=Path('service-worker.js'); s=p.read_text()
          s=s.replace("const CACHE = 'shamatha-shell-v15';","const CACHE = 'shamatha-shell-v16';")
          s=s.replace('20260826-0955',V)
          needle="  './assets/dynamic-journey.css?v="+V+"',"
          if needle in s and 'child-stages.css' not in s:
              s=s.replace(needle,needle+"\n  './assets/child-stages.css?v="+V+"',\n  './assets/child-stages-backend.js?v="+V+"',")
          needle2="  './assets/app.js?v="+V+"',"
          if needle2 in s and 'child-stages.js' not in s:
              s=s.replace(needle2,needle2+"\n  './assets/child-stages.js?v="+V+"',")
          p.write_text(s)
          PY
      - name: Validate JavaScript
        run: |
          node --check assets/stage-identity.js
          node --check assets/child-stages-backend.js
          node --check assets/child-stages.js
          node --check assets/editor-child-stages.js
          node --check assets/lixeira.js
          grep -q "is('parent_stage_id', null)" assets/stage-identity.js
          grep -q 'child-stages-backend.js' app.html
          grep -q 'editor-child-stages.js' editor.html
          grep -q 'shamatha-shell-v16' service-worker.js
      - name: Commit integration
        run: |
          git config user.name Tamosauskas
          git config user.email thiago.gt@gmail.com
          git add assets/stage-identity.js app.html editor.html lixeira/index.html manifest.webmanifest service-worker.js
          git commit -m 'Integra etapas filhas ao app e editor'
          git push origin HEAD:child-stages
