name: Remove stage UI limit
on:
  push:
    branches: [child-stages]
    paths: [.github/workflows/remove-stage-ui-limit.yml]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: child-stages
      - name: Remove UI cap and validate
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('assets/app.js')
          s=p.read_text()
          old="function totalStages() { return Math.max(1, Math.min(30, Number(appData?.stages?.length || 1))); }"
          new="function totalStages() { return Math.max(1, Number(appData?.stages?.length || 1)); }"
          if old not in s:
              raise SystemExit('totalStages cap pattern missing')
          p.write_text(s.replace(old,new,1))
          PY
          node --check assets/app.js
          node --check assets/editor-dynamic-stages.js
          node --check assets/child-stages-backend.js
          node --check assets/child-stages.js
          node --check assets/editor-child-stages.js
          ! grep -q 'Math.min(30' assets/app.js
      - name: Commit
        run: |
          git config user.name Tamosauskas
          git config user.email thiago.gt@gmail.com
          git add assets/app.js
          git commit -m 'Remove limite visual de etapas'
          git push origin HEAD:child-stages
