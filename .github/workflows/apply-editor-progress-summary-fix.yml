name: Apply editor progress and summary controls fix

on:
  push:
    branches:
      - editor-progress-summary-controls
    paths:
      - tools/apply_editor_progress_summary_fix.py
      - .github/workflows/apply-editor-progress-summary-fix.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: editor-progress-summary-controls
      - name: Apply fixes
        run: python3 tools/apply_editor_progress_summary_fix.py
      - name: Validate JavaScript
        run: |
          node --check assets/app.js
          node --check assets/stage-identity.js
          node --check assets/editor-stage-structure.js
          node --check assets/editor-v2.js
      - name: Commit changes
        run: |
          git config user.name Tamosauskas
          git config user.email thiago.gt@gmail.com
          git add app.html editor.html manifest.webmanifest service-worker.js assets/app.js assets/stage-identity.js assets/editor-stage-structure.js assets/editor-stage-structure.css assets/editor-v2.js
          git diff --cached --quiet || git commit -m 'Salva progresso do editor e alinha controles das etapas'
          git push origin HEAD:editor-progress-summary-controls
