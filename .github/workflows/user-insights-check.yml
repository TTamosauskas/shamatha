name: User insights check
on:
  push:
    branches: [user-session-insights-notes]
    paths:
      - assets/editor-enhancements.js
      - supabase/functions/shamatha-editor-activity/index.ts
      - .github/workflows/user-insights-check.yml
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: user-session-insights-notes
      - name: Validate JavaScript
        run: |
          node --check assets/editor-enhancements.js
          grep -q 'sessionsByUserId' assets/editor-enhancements.js
          grep -q 'save_note' supabase/functions/shamatha-editor-activity/index.ts
          grep -q 'stagesById' supabase/functions/shamatha-editor-activity/index.ts
