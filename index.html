<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Centro Pineal — Acesso</title>
  <meta name="theme-color" content="#eaf7fd">
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="icon" href="./app-icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="./assets/site.css">
</head>
<body>
  <main class="auth-wrap">
    <section class="card auth-card">
      <div class="brand" style="margin-bottom:20px"><small>APRENDENDO À MEDITAR</small><strong>Centro Pineal</strong></div>
      <h1>Acesso ao caminho</h1>
      <p class="lead">Entre com sua conta. Novos alunos podem se cadastrar e aguardam a liberação do editor para acessar o conteúdo.</p>

      <div class="tabs" role="tablist">
        <button class="tab active" id="loginTab" type="button">Entrar</button>
        <button class="tab" id="registerTab" type="button">Cadastrar</button>
      </div>

      <form id="loginForm">
        <div class="field"><label for="loginEmail">E-mail</label><input id="loginEmail" type="email" autocomplete="email" required></div>
        <div class="field"><label for="loginPassword">Senha</label><input id="loginPassword" type="password" autocomplete="current-password" minlength="8" required></div>
        <button class="btn primary" style="width:100%" type="submit">Entrar</button>
      </form>

      <form id="registerForm" class="hidden">
        <div class="field"><label for="registerEmail">E-mail</label><input id="registerEmail" type="email" autocomplete="email" required></div>
        <div class="field"><label for="registerPassword">Senha</label><input id="registerPassword" type="password" autocomplete="new-password" minlength="8" required></div>
        <button class="btn primary" style="width:100%" type="submit">Criar conta</button>
      </form>

      <form id="invitePasswordForm" class="hidden">
        <div class="status good" style="margin-bottom:14px">Convite aceito. Defina uma senha para concluir sua conta.</div>
        <div class="field"><label for="invitePassword">Nova senha</label><input id="invitePassword" type="password" autocomplete="new-password" minlength="8" required></div>
        <div class="field"><label for="invitePasswordConfirm">Confirmar senha</label><input id="invitePasswordConfirm" type="password" autocomplete="new-password" minlength="8" required></div>
        <button class="btn primary" style="width:100%" type="submit">Definir senha e continuar</button>
      </form>

      <div id="status" class="status hidden"></div>
      <div id="pendingActions" class="toolbar hidden" style="margin-top:12px">
        <button class="btn secondary small" id="logoutPending" type="button">Sair desta conta</button>
      </div>
    </section>
  </main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="./assets/config.js"></script>
<script src="./assets/supabase-backend.js"></script>
<script src="./assets/shamatha-extensions.js"></script>
<script src="./assets/login.js"></script>
</body>
</html>
